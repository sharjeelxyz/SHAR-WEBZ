<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Website conversion illustration</title>
<desc>A browser window mockup where a scattered path of visitors straightens into a clean line and converts into a customer checkmark, with a rising traffic chart and animated cursor click on the call to action, on a transparent background.</desc>

<defs>
  <clipPath id="imgClip">
    <rect x="430" y="256" width="190" height="150" rx="6"/>
  </clipPath>
  <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <style>
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes floaty2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
    @keyframes ripple { 0% { r: 8; opacity: 0.55; } 100% { r: 34; opacity: 0; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes dash { to { stroke-dashoffset: -300; } }
    @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .float-a { animation: floaty 5.5s ease-in-out infinite; }
    .float-b { animation: floaty2 6.5s ease-in-out infinite; }
    .ripple-1 { animation: ripple 2.4s ease-out infinite; transform-origin: 246px 396px; }
    .ripple-2 { animation: ripple 2.4s ease-out infinite 1.2s; transform-origin: 246px 396px; }
    .pulse-badge { animation: pulse 2.4s ease-in-out infinite; transform-origin: 326px 426px; }
    .flow-dash { stroke-dasharray: 6 8; animation: dash 6s linear infinite; }
    .bar { transform-origin: bottom; animation: barGrow 1s cubic-bezier(.2,.8,.2,1) both; }
  </style>
</defs>

<ellipse cx="380" cy="400" rx="360" ry="320" fill="url(#softGlow)"/>

<g class="float-b">
  <path d="M110 560 C 150 500, 170 470, 246 396" fill="none" stroke="#111111" stroke-width="2" stroke-opacity="0.3" class="flow-dash"/>
  <circle r="5" fill="#1B4DFF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M110 560 C 150 500, 170 470, 246 396"/>
  </circle>
</g>

<g class="float-b">
  <circle cx="96" cy="612" r="26" fill="#EFEFEC" stroke="#111111" stroke-width="1.5"/>
  <circle cx="128" cy="612" r="26" fill="#EFEFEC" stroke="#111111" stroke-width="1.5"/>
  <circle cx="112" cy="586" r="28" fill="#1B4DFF" stroke="#111111" stroke-width="1.5"/>
  <circle cx="112" cy="578" r="8" fill="#FFFFFF"/>
  <path d="M96 604 a16 16 0 0 1 32 0 z" fill="#FFFFFF"/>
  <circle cx="96" cy="606" r="7" fill="#111111" opacity="0.12"/>
  <circle cx="128" cy="606" r="7" fill="#111111" opacity="0.12"/>
  <text x="70" y="656" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">1,204 customers</text>
  <text x="70" y="674" font-family="Arial, sans-serif" font-size="12" fill="#555555">converted this month</text>
</g>

<g transform="translate(80,180) rotate(-2)">
  <rect x="0" y="8" width="560" height="392" rx="18" fill="#111111" opacity="0.06"/>
  <rect x="0" y="0" width="560" height="392" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="0" width="560" height="44" rx="18" fill="#FAFAF8" stroke="#111111" stroke-width="2"/>
  <rect x="0" y="26" width="560" height="18" fill="#FAFAF8"/>
  <circle cx="26" cy="22" r="6" fill="#E4E4E0" stroke="#111111" stroke-width="1"/>
  <circle cx="46" cy="22" r="6" fill="#E4E4E0" stroke="#111111" stroke-width="1"/>
  <circle cx="66" cy="22" r="6" fill="#1B4DFF"/>
  <rect x="100" y="14" width="280" height="16" rx="8" fill="#EFEFEC"/>

  <rect x="40" y="76" width="230" height="20" rx="4" fill="#111111"/>
  <rect x="40" y="104" width="160" height="20" rx="4" fill="#111111"/>
  <rect x="40" y="146" width="280" height="9" rx="4" fill="#D6D6D2"/>
  <rect x="40" y="164" width="230" height="9" rx="4" fill="#D6D6D2"/>
  <rect x="40" y="182" width="260" height="9" rx="4" fill="#D6D6D2"/>

  <rect id="cta" x="40" y="220" width="164" height="46" rx="8" fill="#1B4DFF"/>
  <text x="122" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Start your project</text>

  <rect x="350" y="76" width="190" height="150" rx="6" fill="#F4F4F2" stroke="#111111" stroke-width="1.5"/>
  <g clip-path="url(#imgClip)" transform="translate(-80,-180)">
    <circle cx="470" cy="330" r="18" fill="#1B4DFF" opacity="0.55"/>
    <path d="M430 400 L 480 340 L 515 375 L 545 340 L 620 406 Z" fill="#111111" opacity="0.75"/>
  </g>
</g>

<g class="pulse-badge">
  <circle cx="326" cy="426" r="17" fill="#1B4DFF"/>
  <path d="M319 426 l5 6 l11 -13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g transform="translate(226,376)">
  <path d="M0 20 L18 0 L4 4 L18 0 L14 15 Z" fill="#111111"/>
  <circle class="ripple-1" cx="20" cy="20" r="8" fill="none" stroke="#1B4DFF" stroke-width="2"/>
  <circle class="ripple-2" cx="20" cy="20" r="8" fill="none" stroke="#1B4DFF" stroke-width="2"/>
</g>

<g class="float-a" transform="translate(560,120)">
  <rect x="0" y="12" width="200" height="128" rx="14" fill="#111111" opacity="0.06"/>
  <rect x="-6" y="0" width="200" height="128" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="16" y="30" font-family="Arial, sans-serif" font-size="13" fill="#555555">Traffic this week</text>
  <text x="16" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">+187%</text>
  <g transform="translate(16,66)">
    <rect class="bar" x="0" y="34" width="18" height="26" rx="3" fill="#E4E4E0" style="animation-delay:0.1s"/>
    <rect class="bar" x="26" y="24" width="18" height="36" rx="3" fill="#E4E4E0" style="animation-delay:0.25s"/>
    <rect class="bar" x="52" y="14" width="18" height="46" rx="3" fill="#E4E4E0" style="animation-delay:0.4s"/>
    <rect class="bar" x="78" y="-2" width="18" height="62" rx="3" fill="#1B4DFF" style="animation-delay:0.55s"/>
    <rect class="bar" x="104" y="8" width="18" height="52" rx="3" fill="#E4E4E0" style="animation-delay:0.7s"/>
    <rect class="bar" x="130" y="-8" width="18" height="68" rx="3" fill="#1B4DFF" style="animation-delay:0.85s"/>
  </g>
</g>

<g class="float-a" transform="translate(600,470)">
  <rect x="0" y="0" width="150" height="56" rx="28" fill="#111111"/>
  <circle cx="24" cy="28" r="6" fill="#1B4DFF"/>
  <text x="42" y="33" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SEO optimized</text>
</g>

</svg>
